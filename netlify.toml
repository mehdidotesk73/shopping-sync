[build]
# COMMIT_REF is provided automatically by Netlify — this is what makes the footer's build
# stamp show the actual deployed commit instead of always falling back to "dev".
command = "VITE_BUILD_ID=$COMMIT_REF npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

# Build preview deploys for every branch/PR
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
